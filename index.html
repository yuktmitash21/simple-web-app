<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Add Expense</title>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Expenses</h2>
            <ul>
                <li>Dashboard</li>
                <li>Reports</li>
                <li class="active">Add Expense</li>
                <li>My Expenses</li>
                <li>All Expenses</li>
                <li>My Approvals</li>
                <li>Advance Request</li>
                <li>Advance Payment</li>
                <li>Policy</li>
                <li>Users</li>
                <li>Settings</li>
            </ul>
        </aside>
        <main class="main-content">
            <header>
                <div class="user-info">
                    <span>Chris</span>
                    <img src="user-avatar.png" alt="User Avatar">
                </div>
            </header>
            <section class="form-section">
                <h1>Add Expense</h1>
                <form>
                    <div class="form-group">
                        <label for="report">Add to Report *</label>
                        <select id="report">
                            <option>Road Show</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category">
                            <option>Accommodation</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="vendor">Vendor *</label>
                        <select id="vendor">
                            <option>Budget Suites</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" value="2023-01-18">
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount *</label>
                        <input type="number" id="amount" value="5000">
                    </div>
                    <div class="form-group">
                        <label for="purpose">Expense Purpose</label>
                        <textarea id="purpose"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="receipt">Receipt *</label>
                        <input type="file" id="receipt">
                    </div>
                    <div class="form-group">
                        <label>Reimbursable *</label>
                        <div class="radio-group">
                            <input type="radio" id="yes" name="reimbursable" checked>
                            <label for="yes">Yes</label>
                            <input type="radio" id="no" name="reimbursable">
                            <label for="no">No</label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="reset" class="reset-btn">Reset</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
