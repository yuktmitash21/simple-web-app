<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogwasher Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #282c34;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 20px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 1em;
            margin-bottom: 20px;
            width: 80%;
            max-width: 300px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #444;
            margin: 10px auto;
            padding: 20px;
            border-radius: 5px;
            text-align: left;
            width: 80%;
            max-width: 400px;
        }
        h2 {
            margin: 0;
            padding-bottom: 10px;
        }
        p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Find Your Dogwasher</h1>
        <input type="text" id="searchInput" placeholder="Search by name" oninput="filterDogwashers()">
        <ul id="dogwasherList"></ul>
    </header>

    <script>
        const dogwashers = [
            { id: 1, name: 'Bark & Bubbles', location: 'San Francisco, CA', rating: 4.5 },
            { id: 2, name: 'Paws & Suds', location: 'New York, NY', rating: 4.0 },
            { id: 3, name: 'Furry Clean', location: 'Austin, TX', rating: 5.0 },
            // Add more dogwasher entries as needed
        ];

        function displayDogwashers(list) {
            const dogwasherList = document.getElementById('dogwasherList');
            dogwasherList.innerHTML = '';
            list.forEach(dogwasher => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <h2>${dogwasher.name}</h2>
                    <p>Location: ${dogwasher.location}</p>
                    <p>Rating: ${dogwasher.rating} / 5</p>
                `;
                dogwasherList.appendChild(listItem);
            });
        }

        function filterDogwashers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredDogwashers = dogwashers.filter(dogwasher =>
                dogwasher.name.toLowerCase().includes(searchTerm)
            );
            displayDogwashers(filteredDogwashers);
        }

        // Display all dogwashers on initial load
        displayDogwashers(dogwashers);
    </script>
</body>
</html>
