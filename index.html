<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
        }

        .sidebar {
            background-color: #2196F3; /* Changed to blue */
            color: white;
            width: 250px;
            padding: 20px;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            margin: 15px 0;
        }

        .sidebar .active {
            font-weight: bold;
        }

        .main-content {
            flex-grow: 1;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px;
            background-color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-info img {
            border-radius: 50%;
            margin-left: 10px;
        }

        .form-section {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .radio-group {
            display: flex;
            align-items: center;
        }

        .radio-group label {
            margin-right: 10px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-start;
        }

        .submit-btn {
            background-color: #2196F3; /* Changed to blue */
            color: white;
            padding: 10px 20px;
            border: none;
            margin-right: 10px;
            cursor: pointer;
        }

        .reset-btn {
            background-color: #e0e0e0;
            color: black;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Expenses</h2>
            <ul>
                <li>Dashboard</li>
                <li>Reports</li>
                <li class="active">Add Expense</li>
                <li>My Expenses</li>
                <li>All Expenses</li>
                <li>My Approvals</li>
                <li>Advance Request</li>
                <li>Advance Payment</li>
                <li>Policy</li>
                <li>Users</li>
                <li>Settings</li>
            </ul>
        </aside>
        <main class="main-content">
            <header>
                <div class="user-info">
                    <span>Chris</span>
                    <img src="user-avatar.png" alt="User Avatar">
                </div>
            </header>
            <section class="form-section">
                <h1>Add Expense</h1>
                <form>
                    <div class="form-group">
                        <label for="report">Add to Report *</label>
                        <select id="report">
                            <option>Road Show</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category">
                            <option>Accommodation</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="vendor">Vendor *</label>
                        <select id="vendor">
                            <option>Budget Suites</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" value="2023-01-18">
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount *</label>
                        <input type="number" id="amount" value="5000">
                    </div>
                    <div class="form-group">
                        <label for="purpose">Expense Purpose</label>
                        <textarea id="purpose"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="receipt">Receipt *</label>
                        <input type="file" id="receipt">
                    </div>
                    <div class="form-group">
                        <label>Reimbursable *</label>
                        <div class="radio-group">
                            <input type="radio" id="yes" name="reimbursable" checked>
                            <label for="yes">Yes</label>
                            <input type="radio" id="no" name="reimbursable">
                            <label for="no">No</label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="reset" class="reset-btn">Reset</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
